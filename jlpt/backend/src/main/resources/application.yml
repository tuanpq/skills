spring:
  application:
    name: jlpt-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jlpt}
    username: ${DB_USER:jlpt}
    password: ${DB_PASSWORD:jlpt}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${SERVER_PORT:8080}

jlpt:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:5174}
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-min-256-bits-long-please}
    access-token-expiration-minutes: ${JWT_ACCESS_EXP_MIN:60}
    refresh-token-expiration-days: ${JWT_REFRESH_EXP_DAYS:14}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:jlpt_admin}
    secret-key: ${MINIO_SECRET_KEY:jlpt_admin_secret}
    bucket: ${MINIO_BUCKET:jlpt-audio}
    presigned-url-expiry-minutes: ${MINIO_URL_EXPIRY_MIN:60}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.jlpt.backend: INFO
